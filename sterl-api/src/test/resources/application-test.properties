# Used by every test (Maven Surefire turns on the "test" profile).
# A separate database, so tests can wipe and rebuild it without touching development data.
spring.datasource.url=${STERL_TEST_DB_URL:jdbc:postgresql://localhost:5432/sterl_test}

# Flyway's "clean" (drop everything) is disabled by default for safety. Only tests may use it.
spring.flyway.clean-disabled=false

# Encryption key for TESTS ONLY (random, protects nothing: the test database is thrown away after every run).
# Real keys never live in the repository: STERL_DATA_KEY on servers, ~/.sterl/data-key on a laptop.
sterl.data-key=2xYRI+lJ6E0F70Q9F7P51bZ+3xIR1hKdffqh8+x/Md0=
