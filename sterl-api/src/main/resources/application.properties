spring.application.name=sterl-api

# The Next.js front end runs on 3000; the API on 8080.
server.port=8080

# ---------- Database (PostgreSQL) ----------
# Connection details come from environment variables, so no password is ever written in git.
# The defaults suit Postgres.app on a Mac: database "sterl", your macOS user, no password.
spring.datasource.url=${STERL_DB_URL:jdbc:postgresql://localhost:5432/sterl}
spring.datasource.username=${STERL_DB_USER:${USER:postgres}}
spring.datasource.password=${STERL_DB_PASSWORD:}

# Flyway applies db/migration (the schema) and then db/seed (the fake demo bank), in version order.
# A real bank would never seed through migrations; Sterl's data is 100% fake (ADR-002).
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ---------- Who's asking (until Auth sprint A) ----------
# The seeded demo customer. Replaced by the logged-in user once Spring Security is in.
sterl.demo-customer-id=0d9b0fd3-2248-4649-9245-7c3890921ffc

# ---------- Strict JSON for a money API ----------
# By default Jackson would turn {"amountPence": 12.99} into 12 (a lost 99p) and accept
# {"amountPence": "100"}. Both are rejected with a 400 instead: money is never rounded or guessed.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
# A misspelt field ("ammountPence") is an error, not silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true

# ---------- Errors ----------
# Every error is RFC 9457 "problem details" JSON: {type, title, status, detail, instance}.
# Clients get one predictable shape, and never a stack trace or internal message.
spring.mvc.problemdetails.enabled=true

# ---------- Health checks (Spring Boot Actuator) ----------
# Only expose what's needed over HTTP. Actuator can also show environment variables,
# config and heap dumps: a gift to an attacker, so those stay hidden.
management.endpoints.web.exposure.include=health,info
# Don't reveal internals (database name, disk space...) to anonymous callers.
management.endpoint.health.show-details=never
# Liveness = "is the process stuck?" (restart it). Readiness = "can it take traffic?" (route to it).
# AWS uses these two to decide when to restart the API or send it requests.
management.endpoint.health.probes.enabled=true

# ---------- /actuator/info ----------
management.info.env.enabled=true
info.app.name=Sterl API
info.app.disclaimer=Sterl is a portfolio demo. Not a real bank. All data is fake.
