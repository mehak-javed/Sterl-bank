spring.application.name=sterl-api

# The Next.js front end runs on 3000; the API on 8080.
server.port=8080

# ---------- Database (PostgreSQL) ----------
# Connection details come from environment variables, so no password is ever written in git.
# The defaults suit Postgres.app on a Mac: database "sterl", your macOS user, no password.
spring.datasource.url=${STERL_DB_URL:jdbc:postgresql://localhost:5432/sterl}
spring.datasource.username=${STERL_DB_USER:${USER:postgres}}
spring.datasource.password=${STERL_DB_PASSWORD:}

# Flyway applies db/migration (the schema) and then db/seed (the fake demo bank), in version order.
# A real bank would never seed through migrations; Sterl's data is 100% fake (ADR-002).
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# ---------- Behind the website (proxy) ----------
# The browser reaches the API through the website (Next.js forwards /api/auth/*), so every request
# arrives from the website's server. "native" makes Tomcat read the visitor's real address from the
# X-Forwarded-For header, but ONLY when the request comes from an internal address (localhost or a
# private network, Tomcat's RemoteIpValve default): someone on the internet can't fake their address.
# The audit log and the per-address login limit both depend on this.
server.forward-headers-strategy=native

# ---------- Login sessions ----------
# Sessions live in PostgreSQL (tables created by Flyway V4, so Spring must not create them).
spring.session.jdbc.initialize-schema=never
# A bank logs you out after a short idle time. (The website adds its own 5-minute warning in sprint B.)
# 1 hour without activity, then logged out on the server (Mehak's choice, Nov 12; UK banks often use
# 5-15 minutes). Each request resets the clock.
spring.session.timeout=1h
# The session cookie is HttpOnly + SameSite=Lax always (set in SecurityConfig.cookieSerializer).
# Secure (HTTPS only) is on unless explicitly turned off, e.g. for a plain-http local tool.
sterl.session-cookie.secure=${STERL_COOKIE_SECURE:true}

# Failed-login throttling per network address (see LoginRateLimiter).
sterl.login.max-failures-per-window=10
sterl.login.window=PT1M

# ---------- Strict JSON for a money API ----------
# By default Jackson would turn {"amountPence": 12.99} into 12 (a lost 99p) and accept
# {"amountPence": "100"}. Both are rejected with a 400 instead: money is never rounded or guessed.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
# A misspelt field ("ammountPence") is an error, not silently ignored.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true

# ---------- Errors ----------
# Every error is RFC 9457 "problem details" JSON: {type, title, status, detail, instance}.
# Clients get one predictable shape, and never a stack trace or internal message.
spring.mvc.problemdetails.enabled=true

# ---------- Health checks (Spring Boot Actuator) ----------
# Only expose what's needed over HTTP. Actuator can also show environment variables,
# config and heap dumps: a gift to an attacker, so those stay hidden.
management.endpoints.web.exposure.include=health,info
# Don't reveal internals (database name, disk space...) to anonymous callers.
management.endpoint.health.show-details=never
# Liveness = "is the process stuck?" (restart it). Readiness = "can it take traffic?" (route to it).
# AWS uses these two to decide when to restart the API or send it requests.
management.endpoint.health.probes.enabled=true

# ---------- /actuator/info ----------
management.info.env.enabled=true
info.app.name=Sterl API
info.app.disclaimer=Sterl is a portfolio demo. Not a real bank. All data is fake.

# Encryption key for personal data (names, card details): AES-256, base64.
# Servers: set STERL_DATA_KEY (never commit it). A laptop without it gets its own random key file,
# created once at ~/.sterl/data-key (readable only by you). Lose the key and that data can't be read.
sterl.data-key=${STERL_DATA_KEY:}
sterl.data-key-file=${user.home}/.sterl/data-key

# AI explanations of payment screening decisions (Claude). No key = built-in template, no network.
# The key comes only from the environment (ANTHROPIC_API_KEY), never from a committed file.
sterl.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
sterl.ai.model=claude-opus-5-5
sterl.ai.timeout=20s
