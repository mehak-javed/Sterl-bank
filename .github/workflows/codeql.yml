# CodeQL: GitHub's static analysis. It reads the code (without running it) looking for security bugs:
# SQL injection, cross-site scripting, unsafe deserialisation, path traversal, hard-coded credentials...
# Findings appear under the repo's Security tab and as comments on the pull request that adds them.
#
# Free for public repositories. Runs on every PR, on main, and weekly (new checks are added to
# CodeQL all the time, so old code is re-checked against them).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (an odd minute, so it doesn't queue behind everyone's 00:00 jobs)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # only this job may upload findings to the Security tab
    strategy:
      fail-fast: false # a problem in one language shouldn't hide the other's results
      matrix:
        include:
          # build-mode none: CodeQL reads the source directly, so no database, Maven or npm build is needed.
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # "security-extended" adds more security queries than the default set; still low-noise.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
