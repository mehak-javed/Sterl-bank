# CI for the Java API (sterl-api): compile, run the JUnit tests, package the jar.
# A separate workflow from the front end's ci.yml, so each side shows its own status on a PR.
#
# No `paths:` filter on purpose: if this becomes a required check, a filtered workflow would
# never run on front-end-only PRs and they'd wait forever for it. The build takes about a minute.
name: API CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Java API (build and JUnit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sterl-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin # the same Java build as local development
          java-version: "25"
          cache: maven # reuse downloaded libraries between runs

      # -B: batch mode (no interactive prompts); -ntp: no download progress noise in logs.
      # verify = compile + unit tests + package; fails the run if any test fails.
      - name: Build and test
        run: ./mvnw -B -ntp verify
