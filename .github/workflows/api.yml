# CI for the Java API (sterl-api): compile, run the JUnit tests, package the jar.
# A separate workflow from the front end's ci.yml, so each side shows its own status on a PR.
#
# No `paths:` filter on purpose: if this becomes a required check, a filtered workflow would
# never run on front-end-only PRs and they'd wait forever for it. The build takes about a minute.
name: API CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: Java API (build and JUnit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sterl-api

    # A real PostgreSQL 18 (same major version as Postgres.app locally) runs next to the job,
    # so the JUnit tests check the real constraints and triggers, not an imitation database.
    # The password is a throwaway for this temporary CI container, never a real secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sterl
          POSTGRES_PASSWORD: sterl-ci-only
          POSTGRES_DB: sterl_test
        ports:
          - 5432:5432
        # Wait until PostgreSQL accepts connections before the tests start.
        options: >-
          --health-cmd "pg_isready -U sterl -d sterl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STERL_TEST_DB_URL: jdbc:postgresql://localhost:5432/sterl_test
      STERL_DB_USER: sterl
      STERL_DB_PASSWORD: sterl-ci-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The seed SQL is generated from the front end's JSON fixtures. If someone changed the JSON
      # but forgot `npm run seed:sql`, the database would hold a different bank: fail early.
      - name: Check the seed SQL matches the JSON fixtures
        working-directory: .
        run: |
          npx --yes tsx@4 src/mocks/seed-sql.ts
          git diff --exit-code -- sterl-api/src/main/resources/db/seed/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin # the same Java build as local development
          java-version: "25"
          cache: maven # reuse downloaded libraries between runs

      # -B: batch mode (no interactive prompts); -ntp: no download progress noise in logs.
      # verify = compile + unit tests + package; fails the run if any test fails.
      - name: Build and test
        run: ./mvnw -B -ntp verify
