# Dependabot: opens pull requests to update our dependencies, so known security holes in libraries
# get patched instead of sitting there unnoticed. Every update goes through CI like any other change,
# so a breaking update can't reach main.
#
# Security fixes (Dependabot security updates) are switched on in the repo settings and arrive
# straight away; the routine version updates below arrive weekly.
version: 2

updates:
  # Front end: package.json / package-lock.json
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      # Small, low-risk updates come as ONE pull request instead of twenty.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node version we RUN (.nvmrc = 24, the same in CI and on Vercel).
      # Types for a newer Node would let code call functions that don't exist at runtime: it would
      # compile, pass CI, and crash in production. Raise this together with .nvmrc, never alone.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the new natively compiled TypeScript; our Next.js 16 toolchain fails to build
      # with it (PR #27, Nov 2026). Revisit when Next.js supports it.
      - dependency-name: "typescript"
        versions: [">=7"]

  # Java API: sterl-api/pom.xml (Spring Boot, PostgreSQL driver, Flyway...)
  - package-ecosystem: maven
    directory: "/sterl-api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  # The GitHub Actions our workflows use (checkout, setup-java, codeql-action...)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      github-actions:
        patterns: ["*"]
