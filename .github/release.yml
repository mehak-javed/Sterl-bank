# How GitHub sorts the automatically generated release notes ("Generate release notes" on a release).
# Pull requests are grouped by their labels; give each PR one of these labels before merging.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: "Security"
      labels: [security]
    - title: "Features"
      labels: [feature]
    - title: "Fixes"
      labels: [fix]
    - title: "Documentation"
      labels: [docs]
    - title: "Dependencies"
      labels: [dependencies]
    - title: "CI and tooling"
      labels: [ci, chore]
    - title: "Other changes"
      labels: ["*"]
